name: SiegePlugin
version: '${version}'

main: woo.siegePlugin.SiegePlugin
paper-plugin-loader: woo.siegePlugin.SiegePluginLoader
api-version: '1.21.11'
load: POSTWORLD
depend: [Towny, CombatLog]

commands:
  siege:
    description: Main command for SiegePlugin
    usage: /siege <team|switch <red|blue>|shop|kit|admin <setbanner|resetscores|break [seconds]|resume|setresetpos1|setresetpos2|savesnapshot|resetmap>>

permissions:
  siege.team:
    description: Check your current siege team
    default: true
  siege.switch:
    description: Switch to the other siege team
    default: true
  siege.shop:
    description: Open the siege shop
    default: true
  siege.kit:
    description: Edit your persistent siege kit
    default: true
  siege.admin:
    description: Use siege administration commands
    default: op
  siege.admin.resetscores:
    description: Reset the persistent siege score after confirmation
    default: op
