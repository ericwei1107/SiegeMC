name: SiegePlugin
version: '${version}'

main: woo.siegePlugin.SiegePlugin
paper-plugin-loader: woo.siegePlugin.SiegePluginLoader
api-version: '1.21.11'
load: POSTWORLD
depend: [Towny]
softdepend: [CombatLog]

commands:
  siege:
    description: Main command for SiegePlugin
    usage: /siege <team|switch <red|blue>|shop|admin <setbanner|resetscores|setresetpos1|setresetpos2|savesnapshot|resetmap>>

permissions:
  siege.team:
    description: Check your current siege team
    default: true
  siege.switch:
    description: Switch to the other siege team
    default: true
  siege.shop:
    description: Open the siege shop
    default: true
  siege.admin:
    description: Use siege administration commands
    default: op
