name: SiegePlugin
version: '${version}'

main: woo.siegePlugin.SiegePlugin
paper-plugin-loader: woo.siegePlugin.SiegePluginLoader
api-version: '1.21.11'
load: POSTWORLD
depend: [Towny, CombatLog, Multiverse-Core]

commands:
  siege:
    description: Main command for SiegePlugin
    usage: /siege <team|switch <red|blue>|shop|kit|spectate|rejoin|join|lobby|admin <setbanner|resetscores|break [seconds]|resume|setresetpos1|setresetpos2|savesnapshot|savekit|resetmap>>

permissions:
  siege.team:
    description: Check your current siege team
    default: true
  siege.switch:
    description: Switch to the other siege team
    default: true
  siege.shop:
    description: Open the siege shop
    default: true
  siege.kit:
    description: Receive the configured siege kit
    default: true
  siege.spectate:
    description: Enter siege spectator mode
    default: true
  siege.rejoin:
    description: Rejoin a siege team from spectator mode
    default: true
  siege.join:
    description: Join the siege from the lobby
    default: true
  siege.lobby:
    description: Return to the lobby outside combat and capture sessions
    default: true
  siege.admin:
    description: Use siege administration commands
    default: op
  siege.admin.resetscores:
    description: Reset the persistent siege score after confirmation
    default: op
  siege.minecart.cooldown.bypass:
    description: Bypass the TNT minecart placement cooldown
    default: op
