name: SiegePlugin
version: '${version}'

main: woo.siegePlugin.SiegePlugin
paper-plugin-loader: woo.siegePlugin.SiegePluginLoader
api-version: '1.21.11'
load: POSTWORLD
depend: [Towny, CombatLog]
# Not a hard dependency: SiegePlugin's own map rotation never needs
# Multiverse-Core to be installed. This is purely a load-order hint so that
# when it IS present, it enables (and loads its configured worlds, e.g. a
# Multiverse-managed lobby) before SiegePlugin's startup validation runs.
# Without this, Bukkit has no ordering information between the two plugins
# and startup validation can fail on a world Multiverse hasn't loaded yet.
softdepend: [Multiverse-Core]

commands:
  siege:
    description: Main command for SiegePlugin
    usage: /siege <team|switch <red|blue>|shop|kit|spectate|rejoin|join|lobby|admin <setbanner|savekit|supply|rotation|map>>
  commands:
    description: Show normal SiegePlugin commands
    usage: /commands
  admincommands:
    description: Show SiegePlugin administrator commands
    usage: /admincommands

permissions:
  siege.team:
    description: Check your current siege team
    default: true
  siege.switch:
    description: Switch to the other siege team
    default: true
  siege.shop:
    description: Open the siege shop
    default: true
  siege.kit:
    description: Equip or customize your siege kit
    default: true
  siege.spectate:
    description: Enter siege spectator mode
    default: true
  siege.rejoin:
    description: Rejoin a siege team from spectator mode
    default: true
  siege.join:
    description: Join the siege from the lobby
    default: true
  siege.lobby:
    description: Return to the lobby outside combat and capture sessions
    default: true
  siege.admin:
    description: Use siege administration commands
    default: op
  siege.minecart.cooldown.bypass:
    description: Bypass the TNT minecart placement cooldown
    default: op
