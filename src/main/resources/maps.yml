# SiegePlugin 1.1 clean-copy map templates.
#
# `scripts/deploy.sh` imports the authorized folders from the local
# Sieges-master checkout (MAP_TEMPLATE_SOURCE) into
# plugins/SiegePlugin/maps/templates/<template-folder>, excluding session.lock.
# These folders are never played directly. SiegePlugin copies a selected
# template to a generated active-world folder for each round and deletes only
# that generated copy.
#
# Each initial entry is intentionally disabled until staff set Red/Blue spawns,
# the SiegePlugin capture-banner location/radius, and the arena boundary.
# Sieges' old territory/team configuration is not used.
#
# --------------------------------------------------------------------------
# Required schema for an enabled map
# --------------------------------------------------------------------------
#
#   <map-id>:
#     enabled: true
#     display-name: "Siege of Somewhere"   # shown in chat and on the sidebar
#     template-folder: "somewhere"         # a single folder name under
#                                          # maps/templates, never a path
#     red-spawn:   { x: 0.5, y: 65, z: 0.5, yaw: 0, pitch: 0 }
#     blue-spawn:  { x: 0.5, y: 65, z: 0.5, yaw: 180, pitch: 0 }
#     capture-point:
#       x: 0.5
#       y: 65
#       z: 0.5
#       radius: 16                         # applies horizontally AND vertically
#     bounds:                              # inclusive arena boundary, X/Z only
#       min-x: -256
#       min-z: -256
#       max-x: 256
#       max-z: 256
#
# Coordinates are template-relative: they are resolved against whichever
# generated active copy the round is played in, so they never mention a world
# name. `yaw`/`pitch` are optional and default to 0.
#
# Every spawn and the whole capture radius must sit inside `bounds`, and every
# Y value must be a legal world height. Run `/siege admin rotation validate all`
# after editing this file — it reloads maps.yml and reports each problem.
#
# Registered potion supplies are stored separately in potion-storages.yml and
# are keyed by map id, so re-register them once per map with
# `/siege admin supply register <red|blue>` while standing in that map.
#
# In-game setup: `/siege admin map calibrate <map-id>` creates a disposable
# clean copy. Set both spawns, two bounds corners, and the banner, then use
# `finish` (or `abort` from anywhere). Finish saves block edits into the clean
# template while retaining the previous template as a timestamped backup; map
# coordinates are stored in runtime-map-overrides.yml. The map is enabled only
# after its own validation succeeds. Abort never changes the template.

maps:
  al_quds:
    enabled: false
    display-name: "Siege of Al Quds"
    template-folder: "al_quds"
    calibration-spawn: { x: 3971.5, y: 63, z: -3780.5, yaw: 0, pitch: 0 }
