# SiegeMC default configuration

# This is the deploy-managed base configuration. In-game default-kit captures
# are stored separately in plugins/SiegePlugin/runtime-overrides.yml and win
# over the matching base-kit values without being replaced by deployment.

teams:
  red:
    town: "teamRed"
    display-name: "Red Team"
    color: "RED"
    spawn:
      world: "siegeworld"
      x: 6.116325793347412
      y: -51.84795199653818
      z: 103.97480126649488
  blue:
    town: "teamBlue_"
    display-name: "Blue Team"
    color: "BLUE"
    spawn:
      world: "siegeworld"
      x: 3.4971292926438027
      y: -59.31937692880424
      z: -36.165557417735705

spectator:
  town: "SpectatorTown"

lobby:
  world: "lobby"
  spawn:
    # The Helloween lobby world's authored spawn point.
    x: 1
    y: 4
    z: 0

capture-point:
  world: "siegeworld"
  x: 0
  y: 64
  z: 0
  # Horizontal distance and vertical difference are bounded independently.
  radius: 16
  session-duration-seconds: 420

scoring:
  tick-interval-seconds: 20
  points-per-controller-per-tick: 10
  kill-reward-points: 150
  # The first durable award which reaches this value completes the round.
  winning-score: 10000

# Clean-copy map rotation.
rotation:
  # How long one map copy may take to be copied, loaded, and validated before
  # the attempt is abandoned. A hung copy must not hold everyone in the lobby.
  preparation-timeout-seconds: 300

cleanup:
  minecart-stationary-cleanup-seconds: 300
  minecart-placement-cooldown-seconds: 30

minecart:
  # Active siege TNT-minecart entity budgets. Set either value to 0 to disable
  # that limit. The cooldown-bypass permission also bypasses these caps.
  max-active-per-player: 2
  max-active-arena: 40
  damage:
    balanced-coefficient: 0.825
    full-damage-deficit: 7

sidebar:
  title: "Siege Status"
  server-ip: "Coming soon"

cooldowns:
  ender-pearl-seconds: 15
  riptide-seconds: 5

currency:
  # One opposing-team kill pays 15 coins. Each completed banner controller
  # earns 3 coins every 20-second scoring tick (9 coins per minute).
  per-kill: 15
  per-capture-tick: 3
  # Controller rewards are still durable every scoring interval, but chat is
  # consolidated to avoid flooding players during long banner holds.
  capture-reward-notice-seconds: 60

shop:
  # Bundle contents remain fixed in code; these prices are safe to tune.
  prices:
    ender-pearls: 30
    steak: 12
    golden-carrots: 24
    knockback-sword: 200
    diamond-pickaxe-i: 80
    diamond-pickaxe-ii: 140
    diamond-pickaxe-iii: 200
    diamond-pickaxe-iv: 280
    diamond-pickaxe-v: 360
    netherite-pickaxe-v: 500
    building-blocks: 8
    golden-apples: 24
    cobwebs: 30
    enchanted-bow: 120
    arrows: 18
    trident: 240
    rails: 12
    tnt-minecart: 60

kit:
  # Applies only after Equip My Siege Kit or a successful Save & Equip.
  # Opening and browsing /siege kit is always free. Set to 0 to disable.
  command-cooldown-seconds: 300

