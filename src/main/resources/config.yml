# SiegeMC default configuration

# This packaged file supplies defaults for new installations. Keep the live
# plugins/SiegePlugin/config.yml synchronized without overwriting owner values.

teams:
  red:
    town: "teamRed"
    display-name: "Red Team"
    color: "RED"
    spawn:
      world: "siegeworld"
      x: 6.116325793347412
      y: -51.84795199653818
      z: 103.97480126649488
  blue:
    town: "teamBlue_"
    display-name: "Blue Team"
    color: "BLUE"
    spawn:
      world: "siegeworld"
      x: 3.4971292926438027
      y: -59.31937692880424
      z: -36.165557417735705

spectator:
  town: "SpectatorTown"

lobby:
  world: "lobby"
  spawn:
    x: 16
    y: 67
    z: -48

capture-point:
  world: "siegeworld"
  x: 0
  y: 64
  z: 0
  # Horizontal distance and vertical difference are bounded independently.
  radius: 16
  session-duration-seconds: 420

scoring:
  tick-interval-seconds: 20
  points-per-controller-per-tick: 10
  kill-reward-points: 150
  # The first durable award which reaches this value completes the round.
  winning-score: 10000

# Clean-copy map rotation.
rotation:
  # How long one map copy may take to be copied, loaded, and validated before
  # the attempt is abandoned. A hung copy must not hold everyone in the lobby.
  preparation-timeout-seconds: 300

cleanup:
  minecart-stationary-cleanup-seconds: 300
  minecart-placement-cooldown-seconds: 30

minecart:
  # Active siege TNT-minecart entity budgets. Set either value to 0 to disable
  # that limit. The cooldown-bypass permission also bypasses these caps.
  max-active-per-player: 2
  max-active-arena: 40
  damage:
    balanced-coefficient: 0.825
    full-damage-deficit: 7

sidebar:
  title: "Siege Status"

currency:
  # One opposing-team kill pays 15 coins. Each completed banner controller
  # earns 3 coins every 20-second scoring tick (9 coins per minute).
  per-kill: 15
  per-capture-tick: 3
  # Controller rewards are still durable every scoring interval, but chat is
  # consolidated to avoid flooding players during long banner holds.
  capture-reward-notice-seconds: 60

shop:
  # Bundle contents remain fixed in code; these prices are safe to tune.
  prices:
    ender-pearls: 30
    steak: 12
    experience-bottles: 300
    golden-carrots: 24
    knockback-sword: 200
    diamond-pickaxe-i: 80
    diamond-pickaxe-ii: 140
    diamond-pickaxe-iii: 200
    diamond-pickaxe-iv: 280
    diamond-pickaxe-v: 360
    netherite-pickaxe-v: 500
    building-blocks: 8
    golden-apples: 24
    cobwebs: 30
    enchanted-bow: 120
    arrows: 18
    trident: 240
    rails: 12
    tnt-minecart: 60

kit:
  # Applies only after Equip My Siege Kit or a successful Save & Equip.
  # Opening and browsing /siege kit is always free. Set to 0 to disable.
  command-cooldown-seconds: 300

  # Personal replacements are opt-in so adding this feature cannot change kit
  # balance on an existing server. Each configured slot must contain the
  # inherited default plus at least one explicit replacement. Only storage
  # slots 0-35 are eligible; sword, armor, and offhand slots are never editable.
  #
  # Example (disabled until copied under slots):
  # slots:
  #   2:
  #     display-name: "Utility Slot"
  #     icon: EXPERIENCE_BOTTLE
  #     choices:
  #       default:
  #         use-default: true
  #       alternate_food:
  #         display-name: "Alternate Food"
  #         material: COOKED_BEEF
  #         amount: 16
  editor:
    slots: {}

  # This exact snapshot replaces a player's whole inventory when /siege kit
  # runs and whenever the normal siege lifecycle reapplies their kit.
  #
  # Slot map:
  #   0-8   hotbar
  #   9-35  main inventory
  #   36    boots
  #   37    leggings
  #   38    chestplate
  #   39    helmet
  #   40    offhand
  #
  # Add, remove, or reorder entries freely. Material and potion names use
  # Paper's enum names. Enchantment names are case-insensitive.
  default-loadout:
    slots:
      0:
        material: NETHERITE_SWORD
        amount: 1
        enchantments:
          SHARPNESS: 5
          UNBREAKING: 3
          MENDING: 1
      1:
        material: DIAMOND_AXE
        amount: 1
        enchantments:
          EFFICIENCY: 5
          UNBREAKING: 3
      2:
        material: EXPERIENCE_BOTTLE
        amount: 16
      3:
        material: BAKED_POTATO
        amount: 32
      4:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      5:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      6:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      7:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      8:
        material: POTION
        amount: 1
        potion-type: STRONG_SWIFTNESS
      9:
        material: POTION
        amount: 1
        potion-type: STRONG_SWIFTNESS
      10:
        material: POTION
        amount: 1
        potion-type: STRONG_STRENGTH
      11:
        material: POTION
        amount: 1
        potion-type: STRONG_STRENGTH
      36:
        material: NETHERITE_BOOTS
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          FEATHER_FALLING: 4
          MENDING: 1
      37:
        material: NETHERITE_LEGGINGS
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
      38:
        material: NETHERITE_CHESTPLATE
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
      39:
        material: NETHERITE_HELMET
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
      40:
        material: SHIELD
        amount: 1
