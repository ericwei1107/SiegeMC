# SiegeMC default configuration

# This packaged file supplies defaults for new installations. Keep the live
# plugins/SiegePlugin/config.yml synchronized without overwriting owner values.

teams:
  red:
    town: "teamRed"
    display-name: "Red Team"
    color: "RED"
    spawn:
      world: "siegeworld"
      x: 6.116325793347412
      y: -51.84795199653818
      z: 103.97480126649488
  blue:
    town: "teamBlue_"
    display-name: "Blue Team"
    color: "BLUE"
    spawn:
      world: "siegeworld"
      x: 3.4971292926438027
      y: -59.31937692880424
      z: -36.165557417735705

spectator:
  town: "SpectatorTown"

lobby:
  world: "lobby"
  spawn:
    x: 16
    y: 67
    z: -48

capture-point:
  world: "siegeworld"
  x: 0
  y: 64
  z: 0
  # Horizontal distance and vertical difference are bounded independently.
  radius: 16
  session-duration-seconds: 420

scoring:
  tick-interval-seconds: 20
  points-per-controller-per-tick: 10
  kill-reward-points: 150

activity-cycle:
  enabled: true
  active-duration-seconds: 2700
  break-duration-seconds: 120

cleanup:
  map-reset-interval-hours: 6
  minecart-stationary-cleanup-seconds: 300
  minecart-placement-cooldown-seconds: 30

minecart:
  damage:
    balanced-coefficient: 0.825
    full-damage-deficit: 7

sidebar:
  title: "Siege Status"

currency:
  # Untuned placeholders; adjust only after playtesting.
  per-kill: 0
  per-capture-tick: 0

shop:
  # Untuned placeholders; bundle contents remain fixed in code.
  prices:
    building-blocks: 0
    golden-apples: 0
    cobwebs: 0
    enchanted-bow: 0
    arrows: 0
    trident: 0
    rails: 0
    tnt-minecart: 0

kit:
  # Applies after a successful /siege kit. Set to 0 to disable.
  command-cooldown-seconds: 300

  # This exact snapshot replaces a player's whole inventory when /siege kit
  # runs and whenever the normal siege lifecycle reapplies their kit.
  #
  # Slot map:
  #   0-8   hotbar
  #   9-35  main inventory
  #   36    boots
  #   37    leggings
  #   38    chestplate
  #   39    helmet
  #   40    offhand
  #
  # Add, remove, or reorder entries freely. Material and potion names use
  # Paper's enum names. Enchantment names are case-insensitive.
  default-loadout:
    slots:
      0:
        material: NETHERITE_SWORD
        amount: 1
        enchantments:
          SHARPNESS: 5
          UNBREAKING: 3
          MENDING: 1
      1:
        material: DIAMOND_AXE
        amount: 1
        enchantments:
          EFFICIENCY: 5
          UNBREAKING: 3
      2:
        material: EXPERIENCE_BOTTLE
        amount: 16
      3:
        material: BAKED_POTATO
        amount: 32
      4:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      5:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      6:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      7:
        material: SPLASH_POTION
        amount: 1
        potion-type: STRONG_HEALING
      8:
        material: POTION
        amount: 1
        potion-type: STRONG_SWIFTNESS
      9:
        material: POTION
        amount: 1
        potion-type: STRONG_SWIFTNESS
      10:
        material: POTION
        amount: 1
        potion-type: STRONG_STRENGTH
      11:
        material: POTION
        amount: 1
        potion-type: STRONG_STRENGTH
      36:
        material: NETHERITE_BOOTS
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          FEATHER_FALLING: 4
          MENDING: 1
      37:
        material: NETHERITE_LEGGINGS
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
      38:
        material: NETHERITE_CHESTPLATE
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
      39:
        material: NETHERITE_HELMET
        amount: 1
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
      40:
        material: SHIELD
        amount: 1
        enchantments:
          UNBREAKING: 3

# Set with /siege admin setresetpos1 and setresetpos2, then savesnapshot confirm.
# Resets stay disabled until a snapshot exists.
arena-reset: {}
