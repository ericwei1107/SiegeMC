# SiegeMC default configuration

#NOT THE LIVE SERVER SIDE CONFIG - DONT CHANGE THIS ONE

teams:
  red:
    town: "TeamRed"
    display-name: "Red Team"
    color: "RED"
    spawn:
      world: ""
      x: 0
      y: 0
      z: 0
  blue:
    town: "TeamBlue"
    display-name: "Blue Team"
    color: "BLUE"
    spawn:
      world: ""
      x: 0
      y: 0
      z: 0

capture-point:
  world: "siegeworld"
  x: 0
  y: 64
  z: 0
  # Horizontal distance and vertical difference are bounded independently.
  radius: 16
  session-duration-seconds: 30

scoring:
  # Points awarded every 20 seconds, per player holding the banner.
  banner-control-base-points: 10
  # Points credited to the opposing team when a team player dies.
  enemy-death-bonus-points: 150

minecart:
  tnt-placement-cooldown-seconds: 5
  # Riderless carts that have not moved between two sweeps are removed.
  sweep-interval-seconds: 30

# Set with /siege admin setresetpos1 and setresetpos2, then savesnapshot confirm.
# Resets stay disabled until a snapshot exists.
arena-reset: {}

sidebar:
  title: "Siege Status"
